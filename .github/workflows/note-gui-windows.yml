name: Note GUI native Windows qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHON: python
      CI: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare native toolchain
        run: |
          New-Item -ItemType Directory -Force .tmp/windows-qualification | Out-Null
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node -e "const fs=require('node:fs'); const os=require('node:os'); if(process.platform!=='win32')throw Error('Native Windows required'); fs.writeFileSync('.tmp/windows-qualification/toolchain.json',JSON.stringify({platform:process.platform,release:os.release(),node:process.version,commit:process.env.GITHUB_SHA,runnerImage:process.env.ImageVersion},null,2));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version
          make --version
          npm exec --yes --package=pnpm@10.29.2 -- pnpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install frozen public dependencies
        run: |
          npm exec --yes --package=pnpm@10.29.2 -- pnpm install --frozen-lockfile 2>&1 | Tee-Object .tmp/windows-qualification/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec --yes --package=pnpm@10.29.2 -- pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source, tests, types, build and package consumer
        run: |
          npm exec --yes --package=pnpm@10.29.2 -- make verify PYTHON=python 2>&1 | Tee-Object .tmp/windows-qualification/verify.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual independent browser behavior
        run: |
          npm exec --yes --package=pnpm@10.29.2 -- pnpm test:independent 2>&1 | Tee-Object .tmp/windows-qualification/independent.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack the tested distribution
        run: |
          npm pack --ignore-scripts --pack-destination .tmp/windows-qualification --json | Set-Content .tmp/windows-qualification/package.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "require('node:fs').writeFileSync('.tmp/windows-qualification/result.json',JSON.stringify({status:'PASS',platform:process.platform,commit:process.env.GITHUB_SHA,scope:'Native Windows producer gates; not consumer deployment, Draw.io installation or release acceptance'},null,2));"
      - name: Preserve bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: note-gui-windows-${{ github.sha }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
          path: |
            .tmp/windows-qualification/
            .tmp/package-consumer-types.log
            .tmp/package-consumer-resolution.log
            .tmp/independent-results.json
