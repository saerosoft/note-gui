version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(note-gui)
    ignore:
      # Excalidraw upgrades require reapplying the version-specific pnpm patch.
      - dependency-name: "@excalidraw/excalidraw"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
